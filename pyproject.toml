[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "aie-evidence-lab"
version = "0.1.0"
requires-python = ">=3.12"
description = "Read-only x402 newcomer demand observatory"
[project.scripts]
aie = "aie.cli:main"
[tool.setuptools]
package-dir = {"" = "src"}
[tool.setuptools.packages.find]
where = ["src"]
